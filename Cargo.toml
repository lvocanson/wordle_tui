[package]
name = "wordle_tui"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[features]
# Enables the ratatui-based reference-snapshot generator (test-only).
ratatui-ref = ["dep:ratatui"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["windows", "events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
