[package]
name = "wordle_tui"
version = "0.1.0"
edition = "2021"
build = "build/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["windows", "events"] }
