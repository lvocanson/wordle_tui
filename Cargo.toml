[package]
name = "wordle_tui"
version = "1.1.0"
edition = "2021"
description = "Wordle in the terminal, in a 64 KB binary, no runtime files"
repository = "https://github.com/lvocanson/wordle_tui"
license = "MIT"
build = "build/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[dependencies]
# Size-optimized builds swap crossterm for a vendored copy — see vendor/crossterm/LOCAL_PATCH.md.
crossterm = { version = "0.29.0", default-features = false, features = ["windows", "events"] }

# Windows-only: lets us enable VT (ANSI) processing on the console ourselves (see main::enable_vt),
# so rendering can emit raw escapes without crossterm's per-command ANSI/WinAPI dispatch. Already a
# transitive dep of crossterm on Windows, so it adds nothing to the dependency graph.
[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"

# Off-tree stats reporter (not built by `cargo build`; run with `cargo run --example stats`).
# Reads the build's own constants.rs + corpus.bin, so it never links into the game binary.
[[example]]
name = "stats"
path = "tools/stats.rs"
