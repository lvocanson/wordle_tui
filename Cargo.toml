[package]
name = "wordle_tui"
version = "1.1.0"
edition = "2021"
description = "Wordle in the terminal, in a 64 KB binary, no runtime files"
repository = "https://github.com/lvocanson/wordle_tui"
license = "MIT"
build = "build/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["windows", "events"] }

# Off-tree stats reporter (not built by `cargo build`; run with `cargo run --example stats`).
# Reads the build's own constants.rs + corpus.bin, so it never links into the game binary.
[[example]]
name = "stats"
path = "tools/stats.rs"

# Off-tree symbol-bloat reporter over the linker map (see tools/bloat.rs; replaces cargo-bloat).
[[example]]
name = "bloat"
path = "tools/bloat.rs"

# Tooling-only (examples); dev-dependencies never link into the game binary.
[dev-dependencies]
rustc-demangle = "0.1"

# crossterm is built from the in-tree copy in vendor/crossterm, patched for size; the version
# requirement above still applies to it. Rationale and the full change list:
# vendor/crossterm/LOCAL_PATCH.md.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
