# Local copy of crossterm 0.29.0, trimmed to what this game links. Everything the manifest
# declared for the parts that are gone — the feature flags, their optional dependencies, the
# examples and the dev-dependencies — is gone with them. See LOCAL_PATCH.md.

[package]
edition = "2021"
name = "crossterm"
version = "0.29.0"
authors = ["T. Post"]
description = "A crossplatform terminal library for manipulating terminals."
documentation = "https://docs.rs/crossterm/"
keywords = [
    "event",
    "color",
    "cli",
    "input",
    "terminal",
]
categories = [
    "command-line-interface",
    "command-line-utilities",
]
license = "MIT"
repository = "https://github.com/crossterm-rs/crossterm"

[dependencies.bitflags]
version = "2.9"

[target."cfg(unix)".dependencies.mio]
version = "1.0"
features = ["os-poll"]

[target."cfg(unix)".dependencies.rustix]
version = "1"
features = [
    "std",
    "stdio",
    "termios",
]
default-features = false

[target."cfg(unix)".dependencies.signal-hook]
version = "0.3.17"

[target."cfg(unix)".dependencies.signal-hook-mio]
version = "0.2.4"
features = ["support-v1_0"]
