name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # fmt is platform-independent; once is enough.
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: tests
        run: cargo test

  # Builds the shipping profile (ship, see BUILD.md) and publishes
  # the size report from tools/stats.rs in the job summary. The section total printed there is the
  # number OPTIMIZATION.md tracks; the job itself never fails on size — it makes drift visible.
  size:
    name: size (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # wtui-ship.sh detects the triple from the runner it lands on, so `target` here only names
        # the path the binary comes out at (and labels the job); the toolchain pin and the flags
        # both live in the script.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # No rustup step: the script installs the pinned nightly and its rust-src component itself.
      # `bash wtui-ship.sh` rather than `./wtui-ship.sh` so this does not depend on the executable bit
      # surviving the checkout.
      - name: Build — ship
        shell: bash
        run: bash wtui-ship.sh build
      - name: Size report
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/wordle_tui${{ matrix.suffix }}"
          cargo run --example stats -- "$BIN" | tee stats.txt
          {
            echo "### ${{ matrix.target }} — ship"
            echo '```'
            cat stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
